<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>বাতিঘর | BATIGHAR Central Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ================= PWA META ================= -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- এখন সাধারণ ফাইল হিসেবে manifest.json লিংক করা হচ্ছে (GitHub-এ একই ফোল্ডারে থাকবে) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html, body {
      overscroll-behavior-y: contain;
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(59, 130, 246, 0.5);
    }
    header {
      background-image: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.8)), url('https://lh3.googleusercontent.com/d/13AYuZGLiCJrj5PDqd9IWde0P02w20ImZ');
      background-size: cover;
    }
    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .app-iframe.active {
      display: block;
    }
    .sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }
    .sync-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #ffffff;
      transform: scale(1.02);
    }
    .sub-card-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
    }
    .sub-card-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      color: #ffffff;
    }
    .spin-icon {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .hide-close-btn {
      display: none !important;
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden overscroll-y-contain">

  <!-- ================= FIXED HEADER SECTION ================= -->
  <header class="h-32 md:h-44 flex-shrink-0 z-10 flex items-center px-4 md:px-8 border-b border-slate-800 justify-between gap-2">
    <div class="flex items-center space-x-3 md:space-x-5 min-w-0">
      <img src="https://lh3.googleusercontent.com/d/1k3Rr9pNtHcXPolVi3hDBZozuuxn4wsFy" class="w-12 h-12 md:w-20 md:h-20 rounded-full border-2 border-blue-500 p-0.5 bg-slate-900 object-cover flex-shrink-0" onerror="this.src='https://via.placeholder.com/150'">
      <div class="truncate">
        <h1 class="text-xl md:text-3xl font-bold text-white truncate">বাতিঘর</h1>
        <p class="text-blue-400 text-[10px] md:text-sm tracking-widest uppercase truncate">সম্ভাবনাময় পথের দিক নির্দেশক।</p>
        <p class="text-blue-400 text-[10px] md:text-sm tracking-widest uppercase truncate">POS Printer Management</p>
      </div>
    </div>

    <div class="flex-shrink-0">
      <button id="pwaInstallIndicator" onclick="triggerPwaAction()" class="px-2.5 py-1.5 md:px-4 md:py-2.5 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white text-[11px] md:text-xs font-semibold rounded-lg md:rounded-xl shadow-md transition-all flex items-center gap-1 border border-blue-400/20">
        <i id="installIcon" class="fa-solid fa-cloud-arrow-down text-xs md:text-sm animate-bounce"></i>
        <span id="installText" class="hidden sm:inline">Install App</span>
      </button>
    </div>

    <div class="flex items-center gap-3">
      <div class="relative inline-block">
        <button id="noticeBellBtn" onclick="openNoticeModal()"
                class="relative p-2.5 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/50 rounded-xl text-slate-300 hover:text-white transition-all duration-200"
                title="Notifications">
          <i class="fa-solid fa-bell text-lg"></i>
          <span id="noticeBadge" class="hidden absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 border-2 border-slate-900 rounded-full animate-pulse"></span>
        </button>
      </div>
    </div>

    <!-- ADMIN NOTICE POPUP MODAL -->
    <div id="adminNoticeModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative animate-fadeIn">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2 text-blue-400 font-semibold">
            <i class="fa-solid fa-bullhorn text-lg"></i>
            <span>এডমিন নোটিফিকেশন</span>
          </div>
          <button onclick="closeNoticeModal()" class="text-slate-400 hover:text-white text-lg px-2">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="adminNoticeBody" class="text-slate-200 text-sm leading-relaxed mb-6 whitespace-pre-line bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 max-h-60 overflow-y-auto"></div>
        <button onclick="closeNoticeModal()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-xl transition-all shadow-lg shadow-blue-600/20">
          ঠিক আছে (Got it)
        </button>
      </div>

  </header>

  <!-- ================= SCROLLABLE CONTENT AREA ================= -->
  <main class="flex-grow overflow-y-auto overscroll-y-contain container mx-auto p-6">
    <div id="cardContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div id="loadingState" class="text-center text-slate-500 py-10">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
      <p>অ্যাপ লিস্ট লোড হচ্ছে...</p>
    </div>
  </main>

  <!-- ================= FIXED FOOTER SECTION ================= -->
  <footer class="p-4 md:p-6 flex-shrink-0 z-10 border-t border-slate-800 text-center text-slate-500 text-xs md:text-sm bg-slate-900">
    <p class="mt-1">Md.Iqbal Hossain |Office Number <a href="https://wa.me/8801988800759" target="_blank" style="display:inline-block;"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="22" height="22" alt="WhatsApp"></a></p>
    <p>&copy; 2026 Browsing World Technology |Business Number <a href="https://wa.me/8801858721983" target="_blank" style="display:inline-block;"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="22" height="22" alt="WhatsApp"></a></p>
  </footer>

  <!-- ================= NOTICE POPUP MODAL ================= -->
  <div id="noticeModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-blue-500/30 rounded-2xl max-w-md w-full p-6 shadow-2xl relative animate-fadeIn">
      <button onclick="skipNoticeAndOpen()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-full bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400">
          <i class="fa-solid fa-bullhorn text-lg"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white">জরুরী নোটিশ</h3>
          <p id="noticeAppName" class="text-xs text-blue-400"></p>
        </div>
      </div>
      <div id="noticeText" class="text-slate-300 text-sm leading-relaxed mb-6 bg-slate-950/50 p-4 rounded-xl border border-slate-800 max-h-60 overflow-y-auto"></div>
      <div class="flex items-center justify-between pt-2 border-t border-slate-800">
        <span class="text-xs text-slate-500">অটোমেটিক রিডাইরেক্ট: <b id="noticeTimer" class="text-blue-400">১০</b> সেকেন্ড</span>
        <button onclick="skipNoticeAndOpen()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition-all">
          সরাসরি অ্যাপে যান <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL SYSTEM ================= -->
  <div id="appModal" class="fixed inset-0 z-50 bg-slate-950 hidden flex-col">
    <div class="h-14 bg-slate-900 border-b border-slate-800 flex justify-between items-center px-4">
      <div class="flex items-center text-blue-400 font-medium">
        <span id="modalTitle">Loading...</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="syncAppBtn" onclick="syncActiveApp()" class="sync-btn" title="Reload App">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6"></path>
            <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M2.5 16l1.2 1.8a10 10 0 0 0 18.8-4.3"></path>
          </svg>
          <span>Sync</span>
        </button>
        <button id="closeAppBtn" onclick="closeApp()" class="bg-red-500/20 hover:bg-red-500 text-red-500 hover:text-white px-4 py-1.5 rounded-lg transition-all text-sm font-semibold">
          <i class="fa-solid fa-xmark mr-1"></i> Close App
        </button>
      </div>
    </div>
    <div id="iframeContainer" class="flex-grow relative bg-white"></div>
  </div>

  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
  // ================= 0. কনফিগারেশন =================
  // 👇👇👇 এখানে আপনার Apps Script Web App-এর /exec URL বসান 👇👇👇
  const API_BASE = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE/exec";

  // ================= GLOBAL VARIABLES & STATE =================
  let rawApps = [];
  let pendingAppName = null;
  let noticeCountdownInterval = null;
  let activeAppObj = null;
  const loadedIframes = {};

  // ================= FETCH HELPERS (google.script.run-এর বদলে) =================
  async function fetchAppList() {
    try {
      const res = await fetch(`${API_BASE}?action=data`);
      const data = await res.json();
      rawApps = data.appList || [];
    } catch (err) {
      console.error("App list fetch error:", err);
      document.getElementById('loadingState').innerHTML =
        `<p class="text-red-400">অ্যাপ লিস্ট লোড করা যায়নি। API_BASE URL ঠিক আছে কিনা দেখুন।</p>`;
    }
  }

  async function fetchHtmlFile(filename) {
    try {
      const res = await fetch(`${API_BASE}?action=html&file=${encodeURIComponent(filename)}`);
      const data = await res.json();
      return data.content || "";
    } catch (err) {
      return "<div style='color:#f8fafc;padding:20px;'><h1>Error: Content could not be loaded</h1></div>";
    }
  }

  // ================= 1. SMART PRELOAD ENGINE =================
  function preloadIframes() {
    const iframeContainer = document.getElementById('iframeContainer');
    if (!iframeContainer) return;

    const allAppsToLoad = [];
    rawApps.forEach(app => {
      allAppsToLoad.push({ title: app.title, url: app.url });
      if (app.subApps && app.subApps.length > 0) {
        app.subApps.forEach(sub => {
          allAppsToLoad.push({ title: sub.title, url: sub.url });
        });
      }
    });

    allAppsToLoad.forEach(async (app) => {
      const safeId = 'iframe_' + app.title.replace(/[^a-zA-Z0-9]/g, '_');
      if (document.getElementById(safeId)) return;

      const containerDiv = document.createElement('div');
      containerDiv.id = safeId;
      containerDiv.setAttribute('data-title', app.title);
      containerDiv.className = 'app-iframe hidden w-full h-full overflow-auto bg-slate-900';

      const savedStateUrl = localStorage.getItem('appState_' + encodeURIComponent(app.title));
      const targetUrl = savedStateUrl || app.url;

      if (targetUrl && !targetUrl.startsWith('http')) {
        // প্রজেক্টের ভেতরের HTML ফাইল — iframe + srcdoc দিয়ে লোড করা হচ্ছে
        // (innerHTML-এর বদলে srcdoc ব্যবহার করা হচ্ছে, কারণ innerHTML দিয়ে
        //  বসানো <script> ট্যাগ ব্রাউজারে রান হয় না, কিন্তু srcdoc-এ হয়)
        const htmlContent = await fetchHtmlFile(targetUrl);
        const innerIframe = document.createElement('iframe');
        innerIframe.className = 'w-full h-full border-none';
        innerIframe.setAttribute('allow', 'geolocation');
        innerIframe.srcdoc = htmlContent;
        containerDiv.appendChild(innerIframe);
      } else if (targetUrl) {
        // External Web App URL (নিজস্ব Apps Script deployment বা অন্য কোনো সাইট)
        const iframe = document.createElement('iframe');
        iframe.src = targetUrl;
        iframe.className = 'w-full h-full border-none';
        iframe.setAttribute('allow', 'geolocation');
        containerDiv.appendChild(iframe);
      }

      iframeContainer.appendChild(containerDiv);
      loadedIframes[app.title] = containerDiv;
    });
  }

  // ================= 2. DASHBOARD CARDS RENDER ENGINE =================
  function renderCards() {
    const lastOpenedApp = localStorage.getItem('lastOpenedApp');
    let sortedApps = [...rawApps];

    if (lastOpenedApp) {
      const appIndex = sortedApps.findIndex(app => app.title === lastOpenedApp);
      if (appIndex > -1) {
        const [targetedApp] = sortedApps.splice(appIndex, 1);
        sortedApps.unshift(targetedApp);
      }
    }

    const container = document.getElementById('cardContainer');
    if (!container) return;
    container.innerHTML = '';

    sortedApps.forEach(app => {
      const isRecent = app.title === lastOpenedApp;

      let subCardsHtml = '';
      if (app.subApps && app.subApps.length > 0) {
        subCardsHtml = `
          <div style="margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">
            <span style="font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 8px;">Sub Modules</span>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        `;
        app.subApps.forEach(sub => {
          const subLogo = sub.logo ? `<img src="${sub.logo}" style="width: 14px; height: 14px; object-fit: contain;" onerror="this.style.display='none'">` : '<i class="fa-solid fa-layer-group" style="font-size: 10px;"></i>';
          const safeSubTitle = String(sub.title).replace(/'/g, "\\'");
          subCardsHtml += `
            <button onclick="event.stopPropagation(); triggerAppLaunch('${safeSubTitle}')"
                    class="sub-card-btn"
                    style="padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #93c5fd; display: inline-flex; align-items: center; gap: 6px;"
                    title="${sub.desc || sub.title}">
              ${subLogo}
              <span>${sub.title}</span>
            </button>
          `;
        });
        subCardsHtml += `</div></div>`;
      }

      const safeMainTitle = String(app.title).replace(/'/g, "\\'");

      const cardHtml = `
        <div class="glass-card"
             style="border-radius: 16px; padding: 20px; cursor: pointer; display: flex; flex-direction: column; justify-space-between; border: 1px solid ${isRecent ? '#3b82f6' : 'rgba(255,255,255,0.1)'};"
             onclick="triggerAppLaunch('${safeMainTitle}')">
          <div>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 12px; table-layout: fixed;">
              <tr>
                <td style="width: 60px; vertical-align: top; align: left; padding: 0;">
                  <div style="width: 56px; height: 56px; background: rgba(59, 130, 246, 0.1); border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.2); display: flex; align-items: center; justify-content: center;">
                    <img src="${app.logo}" style="width: 40px; height: 40px; object-fit: contain;" onerror="this.src='https://via.placeholder.com/150'">
                  </div>
                </td>
                <td style="vertical-align: top; text-align: right; padding: 0;">
                  <i class="fa-solid fa-arrow-up-right-from-square" style="color: #64748b; font-size: 14px;"></i>
                  ${isRecent ? '<div style="margin-top: 6px;"><span style="font-size: 10px; background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 2px 8px; border-radius: 9999px; font-weight: 600; display: inline-block;">RECENT</span></div>' : ''}
                </td>
              </tr>
            </table>
            <h3 style="font-size: 18px; font-weight: 600; color: #ffffff; margin: 0 0 6px 0; line-height: 1.3;">${app.title}</h3>
            <p style="font-size: 13px; color: #94a3b8; margin: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${app.desc}</p>
          </div>
          ${subCardsHtml}
        </div>
      `;
      container.innerHTML += cardHtml;
    });

    document.getElementById('loadingState').style.display = 'none';
  }

  // ================= 3. NOTICE POPUP & APP LAUNCH ENGINE =================
  function triggerAppLaunch(name) {
    let appObj = rawApps.find(a => a.title === name);
    if (!appObj) {
      rawApps.forEach(a => {
        if (a.subApps) {
          const foundSub = a.subApps.find(s => s.title === name);
          if (foundSub) appObj = foundSub;
        }
      });
    }

    if (appObj && appObj.notice && appObj.notice.trim() !== "") {
      pendingAppName = name;
      document.getElementById('noticeAppName').innerText = name;
      document.getElementById('noticeText').innerText = appObj.notice;
      document.getElementById('noticeModal').style.display = 'flex';

      let timeLeft = 10;
      document.getElementById('noticeTimer').innerText = timeLeft;
      if (noticeCountdownInterval) clearInterval(noticeCountdownInterval);
      noticeCountdownInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('noticeTimer').innerText = timeLeft;
        if (timeLeft <= 0) skipNoticeAndOpen();
      }, 1000);
    } else {
      openApp(name);
    }
  }

  function skipNoticeAndOpen() {
    if (noticeCountdownInterval) clearInterval(noticeCountdownInterval);
    document.getElementById('noticeModal').style.display = 'none';
    if (pendingAppName) {
      openApp(pendingAppName);
      pendingAppName = null;
    }
  }

  // ================= 4. INSTANT LAUNCH & MEMORY OPTIMIZATION =================
  function openApp(name) {
    localStorage.setItem('lastOpenedApp', name);

    let appObj = rawApps.find(a => a.title === name);
    if (!appObj) {
      rawApps.forEach(a => {
        if (a.subApps) {
          const foundSub = a.subApps.find(s => s.title === name);
          if (foundSub) appObj = foundSub;
        }
      });
    }
    activeAppObj = appObj;

    const safeId = 'iframe_' + name.replace(/[^a-zA-Z0-9]/g, '_');
    document.querySelectorAll('.app-iframe').forEach(container => {
      if (container.id === safeId) {
        container.classList.add('active');
        container.classList.remove('hidden');
      } else {
        container.classList.remove('active');
        container.classList.add('hidden');
      }
    });

    document.getElementById('modalTitle').innerText = name;
    document.getElementById('appModal').style.display = 'flex';

    setTimeout(() => {
      freeMemoryExceptActive(name);
    }, 500);
  }

  function freeMemoryExceptActive(activeTitle) {
    Object.keys(loadedIframes).forEach(key => {
      if (key !== activeTitle) {
        try {
          const container = loadedIframes[key];
          const innerIframe = container ? container.querySelector('iframe') : null;
          if (innerIframe && innerIframe.contentWindow && innerIframe.contentWindow.location.href !== 'about:blank') {
            localStorage.setItem('appState_' + encodeURIComponent(key), innerIframe.contentWindow.location.href);
          }
        } catch (e) {
          // Cross-domain restricted fallback
        }
      }
    });
  }

  // ================= 5. CLOSE APP & AUTO RE-PRELOAD ENGINE =================
  function closeApp() {
    if (activeAppObj) {
      const safeId = 'iframe_' + activeAppObj.title.replace(/[^a-zA-Z0-9]/g, '_');
      const activeContainer = document.getElementById(safeId);
      if (activeContainer) {
        const innerIframe = activeContainer.querySelector('iframe');
        if (innerIframe && innerIframe.contentWindow) {
          try {
            if (innerIframe.contentWindow.location.href !== 'about:blank') {
              localStorage.setItem('appState_' + encodeURIComponent(activeAppObj.title), innerIframe.contentWindow.location.href);
            }
          } catch (e) {
            console.log("State preserved locally");
          }
        }
      }
    }

    document.getElementById('appModal').style.display = 'none';
    document.querySelectorAll('.app-iframe').forEach(container => {
      container.classList.remove('active');
      container.classList.add('hidden');
    });

    activeAppObj = null;
    renderCards();

    setTimeout(() => {
      preloadIframes();
    }, 300);
  }

  // ================= 6. SYNC BUTTON (FORCE REFRESH) =================
  async function syncActiveApp() {
    const syncBtnSvg = document.querySelector('#syncAppBtn svg');
    if (syncBtnSvg) syncBtnSvg.classList.add('spin-icon');

    const activeContainer = document.querySelector('.app-iframe.active');

    if (activeContainer) {
      const appTitle = activeContainer.getAttribute('data-title');
      if (appTitle) {
        localStorage.removeItem('appState_' + encodeURIComponent(appTitle));
      }

      const innerIframe = activeContainer.querySelector('iframe');
      if (innerIframe && innerIframe.src) {
        const currentSrc = innerIframe.src;
        innerIframe.src = currentSrc;
      } else if (innerIframe && appTitle) {
        let appObj = rawApps.find(a => a.title === appTitle);
        if (!appObj) {
          rawApps.forEach(a => {
            if (a.subApps) {
              const foundSub = a.subApps.find(s => s.title === appTitle);
              if (foundSub) appObj = foundSub;
            }
          });
        }
        if (appObj) {
          innerIframe.srcdoc = await fetchHtmlFile(appObj.url);
        }
      }
    }

    setTimeout(() => {
      if (syncBtnSvg) syncBtnSvg.classList.remove('spin-icon');
    }, 800);
  }

  // ================= 7. PWA INSTALL ENGINE =================
  let deferredPrompt;
  const installBtn = document.getElementById('pwaInstallIndicator');
  const installText = document.getElementById('installText');
  const installIcon = document.getElementById('installIcon');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log("SW:", err));
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    updateButtonState(true);
  });

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    setInstalledUI();
  });

  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
    setInstalledUI();
  }

  function updateButtonState(isReady) {
    if (isReady && installText) installText.innerText = "Install App";
  }

  function setInstalledUI() {
    if (installText && installIcon) {
      installText.innerText = "App Installed";
      installIcon.className = "fa-solid fa-circle-check text-emerald-400 text-sm animate-none";
      if (installBtn) {
        installBtn.classList.remove('from-blue-500', 'to-indigo-600');
        installBtn.classList.add('from-slate-800', 'to-slate-800', 'cursor-default');
      }
    }
  }

  async function triggerPwaAction() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        deferredPrompt = null;
        setInstalledUI();
      }
    } else {
      if (window.matchMedia('(display-mode: standalone)').matches || (installText && installText.innerText === "App Installed")) {
        alert("BATIGHAR Dashboard আপনার ডিভাইসে অলরেডি ইনস্টল করা আছে!");
        return;
      }
      alert("💡 ইনস্টল করার সহজ নিয়ম:\n\n" +
            "১. আপনার ব্রাউজারের (যেমন Chrome) ওপরের ডানদিকের '৩টি ডট' (Menu) আইকনে ক্লিক করুন।\n" +
            "২. মেনু থেকে 'Save and share' অথবা সরাসরি 'Install app' (বা Add to Home screen) অপশনে ক্লিক করুন।\n\n" +
            "তাহলে এটি সরাসরি আপনার মোবাইলের হোম স্ক্রিনে অ্যাপ আকারে যুক্ত হয়ে যাবে!");
    }
  }

  // ================= 8. URL PARAM AUTO-OPEN ENGINE =================
  function checkAndOpenParamApp() {
    const urlParams = new URLSearchParams(window.location.search);
    const appParam = urlParams.get('app');

    if (appParam) {
      const searchName = decodeURIComponent(appParam).trim().toUpperCase();
      let appExists = rawApps.find(a => a.title.trim().toUpperCase() === searchName);
      if (!appExists) {
        rawApps.forEach(a => {
          if (a.subApps) {
            const subMatch = a.subApps.find(s => s.title.trim().toUpperCase() === searchName);
            if (subMatch) appExists = subMatch;
          }
        });
      }
      if (appExists) {
        triggerAppLaunch(appExists.title);
        const closeBtn = document.getElementById('closeAppBtn');
        if (closeBtn) closeBtn.style.display = 'none';
      }
    }
  }

  // ================= 9. ADMIN NOTIFICATION & SOUND ENGINE =================
  let currentNoticeData = { text: '', id: '' };
  const notificationAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

  function playNoticeSound() {
    try {
      notificationAudio.currentTime = 0;
      notificationAudio.play().catch(err => console.log("Audio play deferred until user interaction:", err));
    } catch (e) {
      console.error("Audio playback error:", e);
    }
  }

  async function checkAdminNotice() {
    try {
      const res = await fetch(`${API_BASE}?action=notice`);
      const data = await res.json();
      if (data && data.id && data.text) {
        currentNoticeData = data;
        const lastReadId = localStorage.getItem('lastReadNoticeId');
        if (lastReadId !== data.id) {
          showNoticeBadge(true);
          const lastSoundPlayedId = localStorage.getItem('lastSoundPlayedNoticeId');
          if (lastSoundPlayedId !== data.id) {
            playNoticeSound();
            localStorage.setItem('lastSoundPlayedNoticeId', data.id);
          }
        } else {
          showNoticeBadge(false);
        }
      } else {
        showNoticeBadge(false);
      }
    } catch (e) {
      console.error("Notice fetch error:", e);
    }
  }

  function showNoticeBadge(show) {
    const badge = document.getElementById('noticeBadge');
    if (badge) {
      if (show) badge.classList.remove('hidden');
      else badge.classList.add('hidden');
    }
  }

  function openNoticeModal() {
    const modal = document.getElementById('adminNoticeModal');
    const body = document.getElementById('adminNoticeBody');
    if (modal && body) {
      body.innerText = currentNoticeData.text || "বর্তমানে কোনো নতুন নোটিফিকেশন নেই।";
      modal.style.display = 'flex';
      if (currentNoticeData.id) {
        localStorage.setItem('lastReadNoticeId', currentNoticeData.id);
        showNoticeBadge(false);
      }
    }
  }

  function closeNoticeModal() {
    const modal = document.getElementById('adminNoticeModal');
    if (modal) modal.style.display = 'none';
  }

  // ================= 10. LIFECYCLE INIT =================
  window.addEventListener('load', async function () {
    await fetchAppList();
    renderCards();

    setTimeout(() => { preloadIframes(); }, 200);
    setTimeout(checkAndOpenParamApp, 400);

    checkAdminNotice();
    setInterval(checkAdminNotice, 45000);
  });
  </script>
</body>
</html>
